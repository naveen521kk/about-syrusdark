<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Waking up server and redirecting...</p>
    </div>
    <script>
        async function wakeUpAndRedirect() {
            try {
                // Fetch the URL to wake up the server or trigger an action.
                await fetch('http://budget.syrusdark.cc', { 
                    mode: 'no-cors',
                    cache: 'no-store'
                });
            } catch (error) {
                console.error('Error during fetch:', error);
            } finally {
                // Redirect to the target URL regardless of whether the fetch succeeded or failed
                window.location.href = 'https://actual-naveen.internal:5006';
            }
        }
        
        wakeUpAndRedirect();
    </script>
</body>
</html>
